# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: '시니어 백엔드 엔지니어 관점에서 리뷰한다. 동시성·정합성·트랜잭션 경계를 특히 깐깐하게 분석하고, 단순 칭찬보다 구체적인 문제점과 근거·대안을 제시한다. 연결된 이슈의 마일스톤 범위를 넘는 기능이나 인프라는 요구하지 않고 별도 이슈 후보로만 언급한다.'
reviews:
  profile: assertive
  auto_approvals:
    enabled: true
  high_level_summary: false
  pre_merge_checks:
    docstrings:
      mode: 'off'
    custom_checks:
      - name: 초과 판매 동시성 테스트
        mode: warning
        instructions: |-
          diff에 좌석 상태를 바꾸는 코드(상태 전이 또는 held_until 변경)가 있으면, 같은 PR에서 동시성 테스트가 추가되거나 수정됐는지 본다. 동시성 테스트는 ExecutorService와 CountDownLatch 등으로 N개 스레드를 동시에 출발시키고, 성공 건수가 좌석 수를 넘지 않는지와 최종 좌석 상태를 함께 검증하는 테스트다. 그런 테스트가 있으면 통과, 없으면 실패다. 좌석 상태를 바꾸는 코드가 없으면 통과다.
      - name: 외부 I/O의 락·트랜잭션 분리
        mode: warning
        instructions: |-
          diff에서 외부 시스템 호출(결제 API, HTTP 클라이언트, 메시지 발행 등)이 트랜잭션이나 락이 유지되는 동안 실행되면 실패다. 트랜잭션은 @Transactional 메서드, 클래스 단위 @Transactional이 적용되는 메서드, TransactionTemplate.execute 블록을 포함하고, 그 안에서 호출하는 다른 메서드도 같은 트랜잭션 안으로 본다. 락이 유지되는 동안은 Redisson RLock의 lock() 또는 성공한 tryLock() 이후부터 unlock() 전까지와 synchronized 블록을 포함한다. 그런 호출이 없거나 모두 트랜잭션·락 밖에 있으면 통과다.
  path_filters:
    - '!**/build/**'
    - '!**/generated/**'
    - '!**/package-lock.json'
    - '!frontend/public/mockServiceWorker.js'
    - '!frontend/dist/**'
    - '!gradlew'
    - '!gradlew.bat'
    - '!gradle/wrapper/**'
  path_instructions:
    - path: '**/main/java/**/*.java'
      instructions: |-
        이 저장소의 불변식은 "어떤 동시 요청에서도 초과 판매 0건"이다. 스타일보다 아래를 코드 흐름을 따라가며 확인한다. 추측이면 추측이라고 쓰고, 문제를 재현하는 스레드 실행 순서(T1, T2)를 함께 적는다.
        - check-then-act: 잠금 없이 읽은 값(남은 수, 좌석 상태, 주문 상태, 1인 수량)으로 쓰기를 결정하는 경로가 있는지 본다. 판단에 쓰는 행은 FOR UPDATE로 읽거나, 조건부 UPDATE의 영향 행 수로 판단하거나, 유니크·CHECK 제약으로 막아야 한다.
        - 잠금 순서: 구매자 잠금(showtime_buyer) → 좌석(ID 오름차순) → 주문 순서다. 새 경로가 다른 순서로 잠그거나, 정렬 없이 여러 행을 잠그면 교착 가능성으로 지적한다.
        - 잠금 전 읽기: 잠금을 잡기 전에 읽은 엔티티가 영속성 컨텍스트에 남아, 잠금 조회 뒤에도 옛 값으로 판단하는 경우를 찾는다. 벌크 UPDATE나 네이티브 쿼리 뒤 영속성 컨텍스트가 어긋나는 경우도 본다.
        - 격리 수준: 잠금 읽기로 판단하는 트랜잭션이 READ_COMMITTED인지 본다. REPEATABLE_READ에서 잠금 대기 전 스냅샷을 일반 조회로 읽어 판단하는 코드를 지적한다.
        - 시각: 판매 규칙의 판단에 쓰는 현재 시각은 Clock 빈으로 읽는지 본다. 확정처럼 늦을수록 거부해야 하는 판단은 잠금을 모두 잡은 뒤 읽은 시각을 쓰는지 본다. 기한 경계는 "기한 시각부터 만료"다.
        - 지연 만료: 기한이 지난 HELD는 저장 상태를 바꾸지 않고 선점 가능으로 본다. status 값만 보고 held_until을 함께 보지 않는 조회·집계·판단을 지적한다.
        - 전부 아니면 전무: 여러 좌석을 한 주문으로 잡을 때 일부만 반영된 채 커밋될 경로가 있는지 본다.
        - 멱등성: 다시 올 수 있는 쓰기(선점, 확정, 취소, 결제 웹훅)가 같은 결과를 내는지, 그 보장이 애플리케이션 잠금만이 아니라 유니크 제약이나 상태 조건에도 걸려 있는지 본다.
        - 트랜잭션 경계: self-invocation으로 @Transactional이 적용되지 않는 호출, 트랜잭션 안의 외부 호출, 예외를 삼켜 롤백되지 않는 경로를 본다.
        - 분산 락(Redisson이 쓰이는 경우에만): 트랜잭션 커밋 뒤에 해제하는지, try-finally와 isHeldByCurrentThread로 해제하는지, waitTime이 있는지 본다. leaseTime이 임계 구역보다 짧아질 수 있으면 DB 쪽 방어(조건부 UPDATE, 제약)가 남아 있는지 본다. 분산 락만으로 초과 판매를 막는 구조는 지적한다.
        - 도메인 경계: booking, buyer, payment, queue 패키지가 다른 도메인의 리포지토리나 엔티티를 직접 쓰거나 테이블을 조인하지 않는지 본다. 다른 도메인이 내놓은 응용 계층 타입(예: 로그인한 구매자)을 받아 쓰는 것은 지적하지 않는다.
        - 컨트롤러가 엔티티를 그대로 내보내지 않는지 본다. 네이밍·상수 추출 같은 지적은 버그로 이어질 때만 한다.
    - path: '**/test/java/**/*.java'
      instructions: |-
        - 동시성 테스트가 커밋된 DB 상태(성공 건수, 좌석 상태와 소유 주문, 주문·주문좌석 행 수)를 검증하는지 본다. 응답만 보고 DB를 확인하지 않거나, 클래스에 @Transactional이 붙어 커밋되지 않는 테스트를 동시성 검증으로 쓰면 지적한다.
        - 테스트가 실제로 경합을 만드는지 본다. 보호 장치를 빼도 통과할 테스트(스레드가 사실상 순차로 도는 경우, 시각 경계를 고정하지 않은 경우)를 지적한다.
        - 시각 경계는 테스트 시계(MutableClock)로 고정하는지, Thread.sleep에 기대는지 본다.
        - 경계 사례가 빠졌는지 본다: 재고 소진 직전, 중복 요청, 기한 정각, 결제 실패·타임아웃.
        - 메서드 이름 형식, 중복 헬퍼, 사소한 최적화는 지적하지 않는다.
    - path: 'src/main/resources/db/migration/**'
      instructions: |-
        - 불변식을 DB가 직접 막는지 본다: 유니크 제약, CHECK 제약, NOT NULL, 외래 키. 애플리케이션 검사만 있고 제약이 없는 불변식을 지적한다.
        - 잠금 읽기와 집계 쿼리가 쓰는 조건에 인덱스가 있는지 본다. 인덱스가 없으면 InnoDB가 더 넓은 범위를 잠근다.
        - 시각 컬럼은 DATETIME(6)이고 UTC로 저장한다.
        - 데이터가 있는 테이블에 NOT NULL 컬럼을 기본값 없이 추가하거나, 큰 테이블을 오래 잠그는 DDL을 지적한다.
    - path: 'docs/**/*.md'
      instructions: |-
        문서는 아래만 지적한다.
        - 같은 문서 안, 다른 문서(PRD, 기능 명세, API 명세, ADR), 구현된 코드와 서로 모순되는 규칙
        - 정의되지 않은 상태 전이, 빠진 실패 상황, 두 가지로 읽히는 규칙
        문체, 표현, 문단 구성은 지적하지 않는다. 문서에 없는 새 요구사항이나 더 세밀한 재시도·복구 절차를 추가하라고 요구하지 않는다. 그런 제안은 "별도 이슈 후보"로 한 줄만 적는다.
    - path: 'frontend/src/**/*.{ts,tsx}'
      instructions: |-
        구매자 화면(React + TypeScript)은 서버 동작을 보여 주는 용도다. 아래에 해당하고 사용자가 실제로 잘못된 결과를 보게 되는 문제만 지적한다.
        - 좌석·기한·판매 상태의 최종 판단은 서버가 한다. 화면이 서버 응답 없이 성공을 가정하거나 좌석을 직접 고르지 않는지, 남은 시간은 서버 시각을 보정해 보여 주기만 하는지 본다.
        - 선점 요청에는 요청 식별자(Idempotency-Key)를 붙인다. 결과를 모르는 실패(응답 없음, 시간 초과, 5xx)는 같은 식별자와 같은 내용으로 정해진 횟수만 다시 보내고, 서버가 판단한 실패(4xx) 뒤에는 자동 재시도를 포함해 새 식별자를 쓰는지 본다. 선점 요청이 한 번에 하나만 진행되는지 본다.
        - 실패 응답(RFC 9457 Problem Details)의 code마다 기능 명세 8절 "실패 상황별 화면"의 안내와 다음 동작이 처리되는지 본다.
        - 타이머·인터벌·재시도 타이머가 언마운트 때 정리되는지 본다.
        - 접근성은 누를 수 없는 요소, label이 없는 입력처럼 사용을 막는 문제만 본다.
        - 화면 문구는 src/copy.ts에 모으고, 도메인 용어(선점, HELD)는 코드와 API에만 둔다.
        개발용 패널, 목 모듈 로딩, 테스트 헬퍼 중복, 스타일은 지적하지 않는다.
    - path: 'frontend/src/mocks/**'
      instructions: |-
        목 API는 서버가 없을 때 화면을 검증하는 데 쓴다. 아래만 지적한다.
        - 기능 명세·API 명세와 다른 판단: 판매 시작·마감, 1인 최대 좌석 수, 남은 수, 선점 기한, 확정·취소, 같은 요청 식별자를 다시 보냈을 때의 결과
        - src/api/types.ts와 다른 응답 모양
        목 서버의 견고성(오류 처리, 지연 중 경합)은 지적하지 않는다.
    - path: 'frontend/src/**/*.test.{ts,tsx}'
      instructions: |-
        - 실패 상황(실패 코드별 응답, 응답 유실, 시간 경계, 서버와 기기의 시계 차이)을 테스트로 검증하는지 본다.
        - 테스트 이름이 검증하는 행위를 한국어로 드러내는지 본다.
    - path: '**/*.{yml,yaml}'
      instructions: |-
        - docker-compose나 application 설정에서 비밀번호·시크릿이 하드코딩돼 노출되지 않았는지 확인한다.
        - 인증을 지원하는 서비스(DB, 캐시, 메시지 브로커 등)가 비밀번호 없이 열려 있지 않은지, 포트가 모든 네트워크 주소로 공개되지 않았는지 확인한다.
        - 포트 매핑, 헬스체크, 프로파일 분리가 적절한지 본다.
        - application-*.yml: 프로필 사이에 동작을 바꾸는 차이(JDBC URL의 시간대 옵션, 커넥션 풀, 락 대기 시간, 격리 수준)가 테스트 환경과 어긋나지 않는지 본다.
        - 워크플로: 액션이 커밋 SHA로 고정됐는지, permissions가 최소인지 본다.
    - path: 'build.gradle'
      instructions: |-
        새 의존성이 PR 본문에 이유와 함께 적혀 있는지, 연결된 이슈의 마일스톤에서 실제로 쓰이는지 본다. 쓰이지 않는 의존성은 지적한다. Spring BOM이 관리하지 않는 의존성은 버전이 명시됐는지 본다.
  tools:
    languagetool:
      disabled_rules:
        - EN_UNPAIRED_BRACKETS
      disabled_categories:
        - TYPOS
        - TYPOGRAPHY
        - CASING
    checkov:
      enabled: false
    presidio:
      enabled: false
