# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: '시니어 백엔드 엔지니어 관점에서 리뷰한다. 동시성·정합성·트랜잭션 경계를 특히 깐깐하게 분석하고, 단순 칭찬보다 구체적인 문제점과 근거·대안을 제시한다. 연결된 이슈의 마일스톤 범위를 넘는 기능이나 인프라는 요구하지 않고 별도 이슈 후보로만 언급한다.'
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: false
  pre_merge_checks:
    docstrings:
      mode: 'off'
    custom_checks:
      - name: 초과 판매 동시성 테스트
        mode: warning
        instructions: |-
          diff에 좌석 상태를 바꾸는 코드(상태 전이 또는 held_until 변경)가 있으면, 같은 PR에서 동시성 테스트가 추가되거나 수정됐는지 본다. 동시성 테스트는 ExecutorService와 CountDownLatch 등으로 N개 스레드를 동시에 출발시키고, 성공 건수가 좌석 수를 넘지 않는지와 최종 좌석 상태를 함께 검증하는 테스트다. 그런 테스트가 있으면 통과, 없으면 실패다. 좌석 상태를 바꾸는 코드가 없으면 통과다.
      - name: 외부 I/O의 락·트랜잭션 분리
        mode: warning
        instructions: |-
          diff에서 외부 시스템 호출(결제 API, HTTP 클라이언트, 메시지 발행 등)이 트랜잭션이나 락이 유지되는 동안 실행되면 실패다. 트랜잭션은 @Transactional 메서드, 클래스 단위 @Transactional이 적용되는 메서드, TransactionTemplate.execute 블록을 포함하고, 그 안에서 호출하는 다른 메서드도 같은 트랜잭션 안으로 본다. 락이 유지되는 동안은 Redisson RLock의 lock() 또는 성공한 tryLock() 이후부터 unlock() 전까지와 synchronized 블록을 포함한다. 그런 호출이 없거나 모두 트랜잭션·락 밖에 있으면 통과다.
  path_filters:
    - '!**/build/**'
    - '!**/generated/**'
    - '!**/package-lock.json'
    - '!frontend/public/mockServiceWorker.js'
  path_instructions:
    - path: '**/*.java'
      instructions: |-
        - Java 21 + Spring Boot 4 기준으로 리뷰한다.
        - System.out.println 대신 SLF4J 로깅(@Slf4j)을 사용했는지 확인한다.
        - DTO와 JPA 엔티티를 분리하고, 컨트롤러가 엔티티를 직접 외부에 노출하지 않는지 확인한다.
        - 매직 넘버나 반복되는 문자열이 상수로 추출됐는지 본다.
        - 네이밍이 의도를 드러내는지, 죽은 코드가 없는지 본다.
    - path: '**/main/java/**/*.java'
      instructions: |-
        이 프로젝트의 핵심 가치는 분산 환경에서의 동시성 제어다. 아래를 특히 엄격하게 분석한다.
        - 초과 판매(oversell) 불변식: 재고·좌석 차감 로직에 경쟁 조건(race condition)이 없는지, 동시 요청에서 정합성이 깨질 여지가 없는지 코드 흐름을 깊게 따라가며 분석한다.
        - 락 범위: 외부 I/O(결제 PG 호출 등)가 락 구간 *밖*에 있는지 확인한다. 느린 외부 호출이 락 안에 묶여 있으면 처리량·정합성 문제로 지적한다.
        - Redisson 분산 락: 락 획득 후 try-finally로 해제하는지, 해제 전에 현재 스레드가 보유한 락인지(isHeldByCurrentThread) 확인하는지, waitTime으로 무한 대기를 막는지 본다. leaseTime을 지정했다면 임계 구역의 최대 실행 시간보다 충분히 긴지 확인하고, 지정하지 않았다면 watchdog 자동 연장을 전제로 한 것인지 본다. leaseTime 지정을 일괄적으로 요구하지 않는다.
        - 락과 트랜잭션 순서: 분산 락이 트랜잭션 커밋 이후에 해제되는지 확인한다. 트랜잭션 안에서 락을 먼저 해제하면 커밋 전에 다른 요청이 락을 얻어 변경 전 데이터를 읽을 수 있다.
        - @Transactional: 트랜잭션 경계가 적절한지, 같은 클래스 내부 호출(self-invocation)로 트랜잭션이 적용되지 않는 함정이 없는지, 외부 호출이 트랜잭션 안에 묶여 DB 커넥션을 오래 점유하지 않는지 본다.
        - 멱등성: 결제·확정처럼 재시도될 수 있는 연산이 멱등하게 설계됐는지 확인한다.
        - 예외 처리가 구체적인지, 비즈니스 예외와 시스템 예외가 구분되는지 본다.
    - path: '**/test/java/**/*.java'
      instructions: |-
        테스트 코드는 다음에 집중한다.
        - 동시성 테스트가 실제로 여러 스레드를 띄워(CountDownLatch/ExecutorService 등) 초과 판매가 일어나지 않는다는 불변식을 검증하는지 확인한다.
        - 경계·엣지 케이스 커버리지: 동시 요청, 재고 소진 직전, 중복 요청, 락 경합, 결제 실패·타임아웃 등.
        - 검증하는 행위가 한국어 @DisplayName에 드러나는지 본다. 메서드 이름 형식은 따로 요구하지 않는다.
        - 단순 스타일 지적이나 사소한 최적화는 관대하게 본다.
    - path: 'frontend/src/**/*.{ts,tsx}'
      instructions: |-
        구매자 화면(React + TypeScript)은 다음에 집중한다.
        - 좌석·기한·판매 상태의 최종 판단은 서버가 한다. 화면이 서버 응답 없이 성공을 가정하거나 좌석을 직접 고르지 않는지, 남은 시간은 서버 시각을 보정해 보여 주기만 하는지 본다.
        - 선점 요청의 응답을 받지 못하면 바로 다시 보내지 않고 내 예매에서 방금 만든 예매를 먼저 찾는지 본다. 확정·취소는 다시 보내도 같은 결과라는 전제를 지키는지 본다.
        - 실패 응답(RFC 9457 Problem Details)의 code마다 기능 명세 8절 "실패 상황별 화면"의 안내와 다음 동작이 빠짐없이 처리되는지 본다.
        - 타이머·인터벌·재시도 타이머가 언마운트 때 정리되는지, 훅 의존성 때문에 요청이 반복되지 않는지 본다.
        - 접근성: 누를 수 있는 요소는 button이나 a이고, 아이콘 버튼에 aria-label이 있고, 입력에 label이 연결되고, 상태 변화가 role="status"나 aria-live로 전달되는지 본다.
        - 화면 문구는 src/copy.ts에 모으고, 화면 어휘는 예매처에서 통용되는 말을 쓴다. 도메인 용어(선점, HELD)는 코드와 API에만 둔다.
        - 사소한 스타일 지적은 관대하게 본다.
    - path: 'frontend/src/mocks/**'
      instructions: |-
        목 API는 서버가 없을 때 화면을 검증하는 데 쓴다.
        - 판매 시작·마감, 1인 최대 좌석 수, 잔여석, 선점 기한, 확정·취소 규칙을 기능 명세 5~7절과 같게 판단하는지 본다. 시나리오는 상황만 만들고, 거부는 규칙이 하는지 본다.
        - 응답 모양이 src/api/types.ts와 맞는지 본다.
    - path: 'frontend/src/**/*.test.{ts,tsx}'
      instructions: |-
        - 실패 상황(실패 코드별 응답, 응답 유실, 시간 경계, 서버와 기기의 시계 차이)을 테스트로 검증하는지 본다.
        - 테스트 이름이 검증하는 행위를 한국어로 드러내는지 본다.
    - path: '**/*.{yml,yaml}'
      instructions: |-
        - docker-compose나 application 설정에서 비밀번호·시크릿이 하드코딩돼 노출되지 않았는지 확인한다.
        - 인증을 지원하는 서비스(DB, 캐시, 메시지 브로커 등)가 비밀번호 없이 열려 있지 않은지, 포트가 모든 네트워크 주소로 공개되지 않았는지 확인한다.
        - 포트 매핑, 헬스체크, 프로파일 분리가 적절한지 본다.
  tools:
    languagetool:
      disabled_rules:
        - EN_UNPAIRED_BRACKETS
      disabled_categories:
        - TYPOS
        - TYPOGRAPHY
        - CASING
    checkov:
      enabled: false
    presidio:
      enabled: false
